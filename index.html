<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>砍一刀AI - 聪明一点的 AI</title>
  <meta name="description" content="砍一刀AI：聪明、直接、可靠的中文 AI 助手。">

  <style>
    :root {
      --bg: #f7f7f5;
      --text: #18181b;
      --muted: #71717a;
      --line: #e7e7e4;
      --black: #111111;
      --assistant: #ffffff;
      --user: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "PingFang SC", sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      overflow: hidden;
    }

    aside {
      min-width: 0;
      height: 100%;
      padding: 18px 14px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .logo {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      object-fit: cover;
      border-radius: 11px;
      background: #111;
      display: block;
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
    }

    .new-chat {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      text-align: left;
    }

    .new-chat:active {
      transform: scale(.99);
    }

    .side-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      padding: 16px 10px;
    }

    main {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.72);
    }

    .title {
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    #messages {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 42px 20px 170px;
      -webkit-overflow-scrolling: touch;
    }

    .welcome {
      width: min(780px, 100%);
      margin: 0 auto;
      text-align: center;
    }

    .big-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 23px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 14px 35px rgba(0,0,0,.12);
    }

    .big-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 50px);
      letter-spacing: -.04em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 13px;
      cursor: pointer;
    }

    .chip:active {
      transform: scale(.98);
    }

    .row {
      width: min(840px, 100%);
      margin: 0 auto 25px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      overflow: hidden;
      border-radius: 11px;
      background: #111;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bubble {
      max-width: min(720px, 82%);
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      background: var(--assistant);
      border: 1px solid var(--line);
      box-shadow: 0 7px 24px rgba(0,0,0,.035);
    }

    .user .bubble {
      background: var(--user);
      color: #fff;
    }

    .composer-wrap {
      flex: 0 0 auto;
      padding: 12px 20px 18px;
      background: linear-gradient(
        to top,
        rgba(247,247,245,1) 0%,
        rgba(247,247,245,.96) 65%,
        rgba(247,247,245,0) 100%
      );
    }

    .composer {
      width: min(840px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid #dcdcd8;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
    }

    textarea {
      min-width: 0;
      flex: 1;
      min-height: 28px;
      max-height: 150px;
      padding: 8px 6px;
      border: 0;
      outline: 0;
      resize: none;
      line-height: 1.5;
      background: transparent;
    }

    .send {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .send:disabled {
      opacity: .35;
      cursor: default;
    }

    .hint {
      width: min(840px, 100%);
      margin: 7px auto 0;
      text-align: center;
      color: #9a9a9a;
      font-size: 11px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #999;
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing i:nth-child(2) {
      animation-delay: .15s;
    }

    .typing i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .25; }
      40% { opacity: 1; }
    }

    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        display: none;
      }

      header {
        height: 58px;
        flex-basis: 58px;
        padding: 0 15px;
      }

      #messages {
        padding: 30px 12px 150px;
      }

      .bubble {
        max-width: 90%;
      }

      .composer-wrap {
        padding: 8px 10px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside>
      <div class="brand">
        <img class="logo" src="avatar.png.PNG" alt="砍一刀">
        <span>砍一刀AI</span>
      </div>

      <button class="new-chat" id="newChat" type="button">＋ 新对话</button>

      <div class="side-note">
        砍一刀AI<br>
        聪明、直接、可靠。
      </div>
    </aside>

    <main>
      <header>
        <div class="title">砍一刀</div>
        <div class="status">
          <span class="dot"></span>
          在线
        </div>
      </header>

      <div id="messages">
        <section class="welcome" id="welcome">
          <div class="big-logo">
            <img src="avatar.png.PNG" alt="砍一刀">
          </div>

          <h1>你好，我是砍一刀</h1>
          <div class="subtitle">有什么想聊的，直接告诉我。</div>

          <div class="chips">
            <button class="chip" type="button" data-prompt="帮我写一段介绍自己的文字">帮我写一段文字</button>
            <button class="chip" type="button" data-prompt="帮我想一个好玩的点子">帮我想个点子</button>
            <button class="chip" type="button" data-prompt="给我讲一个有意思的知识">讲个有意思的知识</button>
          </div>
        </section>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="问砍一刀任何问题……"></textarea>
          <button class="send" id="send" type="submit" aria-label="发送">➤</button>
        </form>
        <div class="hint">砍一刀可能会犯错，请核实重要信息。</div>
      </div>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const form = document.getElementById("form");
    const newChat = document.getElementById("newChat");

    let history = [];

    function addMessage(role, text, temporary = false) {
      welcome.style.display = "none";

      const row = document.createElement("div");
      row.className = "row " + role;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerHTML = '<img src="avatar.png.PNG" alt="砍一刀">';
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (temporary) {
        bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      return row;
    }

    async function sendMessage(text) {
      text = String(text || "").trim();

      if (!text || send.disabled) {
        return;
      }

      addMessage("user", text);
      history.push({
        role: "user",
        content: text
      });

      input.value = "";
      input.style.height = "auto";
      send.disabled = true;

      const typing = addMessage("assistant", "", true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        typing.remove();

        if (!response.ok) {
          throw new Error(data.error || ("服务器错误：" + response.status));
        }

        const reply = data.reply || "抱歉，我没有收到有效回复。";

        addMessage("assistant", reply);

        history.push({
          role: "assistant",
          content: reply
        });

      } catch (error) {
        typing.remove();
        addMessage("assistant", "抱歉，出错了：\n" + error.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", function() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".chip").forEach(function(chip) {
      chip.addEventListener("click", function() {
        sendMessage(chip.dataset.prompt || "");
      });
    });

    newChat.addEventListener("click", function() {
      history = [];
      messagesEl.innerHTML = "";
      messagesEl.appendChild(welcome);
      welcome.style.display = "";
      input.value = "";
      input.style.height = "auto";
      input.focus();
    });
  </script>
</body>
</html>
